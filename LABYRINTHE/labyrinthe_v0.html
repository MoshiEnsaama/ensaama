<html>

  <head>

    <script src="https://aframe.io/releases/1.8.0/aframe.min.js">
    </script>
    <style>
    </style>

  </head>


  <body>

      <a-scene>

        <a-assets>

          <!-- //texture -->
          <img id="stonewall" src="./assets/texture/stonewall.jpg!d">  
          <img id="sky" src="./assets/texture/sky.jpg">
          <img id="ground" src="./assets/texture/dirt.avif">

          <a-mixin id="mur" material.side="both" material="src: #stonewall; repeat: 1 2"></a-mixin>
          <a-mixin id="murext" material.side="both" material="src: #stonewall; repeat: 7 2"></a-mixin>
          <a-mixin id="taille0" geometry="width: 2; height: 1.2; depth: 0.1"></a-mixin>
          <a-mixin id="taille1" geometry="width: 1.005; height: 5; depth: 0.1"></a-mixin>
          <a-mixin id="taille2" geometry="width: 2; height: 5; depth: 0.1"></a-mixin>
          <a-mixin id="taille3" geometry="width: 10; height: 5; depth: 0.1"></a-mixin>

          <!-- //objet -->
          <a-asset-item id="skull" src="./assets/3Dmodels/exp3_obj_skull/12140_Skull_v3_L2.obj"></a-asset-item>
          <a-asset-item id="skull-mtl" src="./assets/3Dmodels/exp3_obj_skull/12140_Skull_v3_L2.mtl"></a-asset-item>

        </a-assets>


        <!-- //sol -->
        <a-box position="0 0 0" rotation="0 0 0" width="50" height="0.1" depth="50" material.side="both" material="src: #ground; repeat: 15 15"></a-box>

        <!-- //séparation entrée -->
        <a-box mixin="murext taille3" position="-7 2.5 2" rotation="0 0 0"></a-box>
        <a-box mixin="murext taille3" position="7 2.5 2" rotation="0 0 0"></a-box>

        <!-- //tour -->
        <a-box mixin="mur taille2" position="-2 2.5 1" rotation="0 90 0"></a-box>
        <a-box mixin="mur taille1" position="-1.5 2.5 2" rotation="0 0 0"></a-box>
        <a-box mixin="mur taille1" position="-2 2.5 -1.5" rotation="0 90 0"></a-box>
        <a-box mixin="mur taille2" position="-1 2.5 -2" rotation="0 0 0"></a-box>
        <a-box mixin="mur taille2" position="1 2.5 -2" rotation="0 0 0"></a-box>
        <a-box mixin="mur taille2" position="2 2.5 -1" rotation="0 90 0"></a-box>
        <a-box mixin="mur taille2" position="2 2.5 1" rotation="0 90 0"></a-box>

        <!-- //intérieur -->
        <a-box mixin="mur taille1" position="-1.5 2.5 0" rotation="0 0 0"></a-box>
        <a-box mixin="mur taille1" position="-1 2.5 -0.5" rotation="0 90 0"></a-box>
        <a-box mixin="mur taille2" position="1 2.5 2" rotation="0 0 0"></a-box>
        <a-box mixin="mur taille1" position="-0.5 2.5 1" rotation="0 0 0"></a-box>
        <a-box mixin="mur taille1" position="-0.5 2.5 0" rotation="0 0 0"></a-box>
        <a-box mixin="mur taille1" position="0 2.5 1.5" rotation="0 90 0"></a-box>
        <a-box mixin="mur taille1" position="1.5 2.5 0" rotation="0 0 0"></a-box>
        <a-box mixin="mur taille1" position="1 2.5 0.5" rotation="0 90 0"></a-box>
        <a-box mixin="mur taille1" position="-0.5 2.5 -1" rotation="0 0 0"></a-box>
        <a-box mixin="mur taille1" position="1 2.5 -0.5" rotation="0 90 0"></a-box>

        <!-- //objet -->
        <a-entity obj-model="obj: #skull; mtl: #skull-mtl" position="1.7 0.1 0.2" scale="0.01 0.01 0.01" rotation="270 310 0"> </a-entity>

        <a-sky src="#sky"></a-sky>
        
        <a-entity camera look-controls wasd-controls="acceleration:10" position="0 1.6 5" look-controls.enabled=true>

        </a-entity>
        <a-entity light="type: ambient; color: #333C4F"></a-entity>
        <a-entity light="type: directional; color: #D6E2FF; intensity: 1" position="8 20 15"></a-entity>
      
      </a-scene>

  </body>

</html>
